# sigiled.toml â€” SIGILED v2 workload manifest (contract Â§7â€“Â§8).
# Read from master; job definitions refresh within ~5 min of a close.

template = "vm-tmpl@0.1.0"

# Per-project session/job image (DEC-25): built from this Dockerfile at
# master, content-addressed. Carries the Rust toolchain so sessions and
# job runs never need the userspace rustup+zig bootstrap again.
[workspace]
dockerfile = "Dockerfile"

# Daily update run (SPEC Â§4): fetch enrolled lists, diff, write state,
# render + publish gh-pages, mem0 digest. M0 wires the cron; the command
# grows with M1/M3.
[jobs.update]
cron = "30 5 * * *"
command = "./jobs/update.sh"
timeout_minutes = 45

# gh-pages deploy key for the publish step, from the SIGILED env
# (/opt/sigiled/.env), injected at container creation. The mem0 digest
# needs no secret: services call each other on the internal network,
# auth lives at the edge.
[jobs.update.secrets]
GH_DEPLOY_KEY = "GH_DEPLOY_KEY"

# State + digest queue live on a volume (SPEC Â§6) â€” survives the
# disposable job containers.
[volumes]
awesome-ledger-data = "/data:rw"
