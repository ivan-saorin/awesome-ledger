[package]
name = "awesome-ledger"
version = "0.2.0"
edition = "2021"
description = "The Awesome Ledger — entry-level diff feed over the GitHub awesome ecosystem (M2: site renderer + gh-pages publish)"

[dependencies]
anyhow = "1"
askama = "0.12"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
